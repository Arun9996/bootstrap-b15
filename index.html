<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>
</head>
<body>
    <h1>Interactive Student Details</h1>
    <script>
        document.write(
    prompt("Enter Student ID, Name, and 5 Marks (comma-separated):")
        .split(",")
        .reduce((res, val, i, arr) => 
            i < 2 
                ? res += `${['ID', 'Name'][i]}: ${val.trim()}<br>` 
                : (res += `Mark ${i - 1}: ${val.trim()}<br>`, 
                   res += (i === arr.length - 1 
                       ? `Total: ${(t = arr.slice(2).map(Number).reduce((s, n) => s + n))}, Percentage: ${(p = t / 5)}%, Grade: ${(g = p > 90 ? 'A' : p > 80 ? 'B' : p > 70 ? 'C' : p > 60 ? 'D' : p > 50 ? 'E' : 'Fail')}<br>` 
                       : "")
                  ), 
            ""
        )
);

    </script>
</body>
</html>
